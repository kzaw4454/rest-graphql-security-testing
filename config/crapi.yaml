target:
  name: crapi
  base_url: "http://127.0.0.1:8888"
  timeout_seconds: 10
  # MailHog captures the welcome email crAPI sends on signup, which
  # contains the VIN/pincode needed to register a vehicle to an account.
  mailhog_base_url: "http://127.0.0.1:8025"

  # Endpoints for auth flows and the injection targets.
  endpoints:
    signup: "/identity/api/auth/signup"
    login: "/identity/api/auth/login"
    validate_coupon: "/community/api/v2/coupon/validate-coupon"
    apply_coupon: "/workshop/api/shop/apply_coupon"
    add_vehicle: "/identity/api/v2/vehicle/add_vehicle"
    vehicles: "/identity/api/v2/vehicle/vehicles"
    vehicle_location: "/identity/api/v2/vehicle/{vehicle_id}/location"
    dashboard: "/identity/api/v2/user/dashboard"
    create_order: "/workshop/api/shop/orders"
    order_detail: "/workshop/api/shop/orders/{order_id}"
    orders_all: "/workshop/api/shop/orders/all"

# Test identities
test_users:
  attacker:
    name: "Attacker One"
    email: "attacker.crapi.test@test.local"
    password: "Password123!"
    number: "9876543210"
  victim:
    name: "Victim One"
    email: "victim.crapi.test@test.local"
    password: "Password123!"
    number: "9876543211"

auth:
  token_header: "Authorization"
  token_prefix: "Bearer"

# Scan scope / test data lives in config, not hardcoded in source.
scan:
  # Mongo operator payloads for the coupon_code field of validate-coupon.
  nosql_coupon_payloads:
    - {"$ne": 1}
    - {"$gt": ""}
    - {"$nin": [1]}

  # String payloads for the coupon_code field of apply_coupon.
  sqli_coupon_payloads:
    - "0'; select version() --+"
    - "0' or '0' = '0"

  # Product bought via create_order to set up the BOLA order-access test.
  shop_product_id: 1

