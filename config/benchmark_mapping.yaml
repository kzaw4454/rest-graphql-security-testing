- id: rest_03_sqli_vampi
  architecture: rest
  plan_row: 3
  test_case: "SQL Injection"
  app: vampi
  framework_test_name: sqli_user_lookup
  tool: zap
  classification: clean
  target:
    base_url: "http://127.0.0.1:5001"
    # {username} resolved to a real seeded username so ZAP has a concrete
    # URL to spider and fuzz with its own SQLi active-scan rule.
    endpoint: "/users/v1/name1"
    method: GET
    scan_type: active
  owasp_category: "API8:2023 Security Misconfiguration"
  notes: "No auth required; ZAP's active scan reaches this endpoint directly."

- id: rest_04_nosqli_sqli_crapi
  architecture: rest
  plan_row: 4
  test_case: "NoSQL/SQL Injection"
  app: crapi
  framework_test_name:
    - nosqli_coupon_validate
    - sqli_apply_coupon
  tool: zap
  classification: partial
  target:
    - base_url: "http://127.0.0.1:8888"
      endpoint: "/community/api/v2/coupon/validate-coupon"
      method: POST
      scan_type: active
      requires_auth: true
    - base_url: "http://127.0.0.1:8888"
      endpoint: "/workshop/api/shop/apply_coupon"
      method: POST
      scan_type: active
      requires_auth: true
  owasp_category:
    - "API8:2023 Security Misconfiguration"
    - "API8:2023 Security Misconfiguration"
  notes: >
    Both endpoints require a registered crAPI session, which ZAP's active
    scan does not establish on its own; caveat as partial pending an
    authenticated ZAP context (e.g. an HTTP Sender script attaching a
    bearer token).

- id: rest_05_jwt_weak_signing_vampi
  architecture: rest
  plan_row: 5
  test_case: "JWT weak signing bypass"
  app: vampi
  framework_test_name: jwt_weak_signing_bypass
  tool: zap
  classification: partial
  target:
    base_url: "http://127.0.0.1:5001"
    endpoint: "/books/v1/{book_title}"
    method: GET
    scan_type: active
  owasp_category: "API2:2023 Broken Authentication"
  notes: >
    ZAP has no built-in rule that forges or key-guesses JWT signatures;
    its active scan can reach the endpoint but cannot itself reproduce the
    weak-secret bypass, so this is caveated as partial.

