- id: rest_07_data_exposure_vampi
  architecture: rest
  plan_row: 7
  test_case: "Excessive Data Exposure (debug endpoint)"
  app: vampi
  framework_test_name: vampi_debug_endpoint_exposure
  tool: zap
  classification: partial
  target:
    base_url: "http://127.0.0.1:5001"
    endpoint: "/users/v1/_debug"
    method: GET
    scan_type: active
  owasp_category: "API3:2023 Excessive Data Exposure"
  notes: >
    ZAP's active scan reaches this unauthenticated endpoint, but has no
    built-in rule that recognises plaintext-password disclosure in a JSON
    response body as a finding on its own -- caveat as partial.

