# Target configuration for VAmPI (REST target)

target:
  name: vampi
  base_url: "http://127.0.0.1:5001"
  timeout_seconds: 10

  # Endpoints for auth flows
  endpoints:
    register: "/users/v1/register"
    login: "/users/v1/login"
    createdb: "/createdb"
    # GET /users/v1/{username} builds raw SQL via f-string interpolation
    # when vulnerable=1, and requires no auth token.
    sqli_target: "/users/v1/{username}"
    # GET /users/v1/_debug returns every user's full record, including the
    # plaintext password column, with no auth requirement at all.
    debug: "/users/v1/_debug"

# Test identities
# Synthetic/fictional per Data Protection Act 2018 compliance.
test_users:
  attacker:
    username: "bob"
    password: "Password123"
    email: "bob@test.local"
  victim:
    username: "alice"
    password: "Password123"
    email: "alice@test.local"

# Optional: raise token lifetime to match the container's tokentimetolive setting
auth:
  token_header: "Authorization"
  token_prefix: "Bearer"

# SQLi payloads for the `username` path parameter of GET /users/v1/{username}
# (see endpoints.sqli_target). Boolean-based and comment-based payloads are
# checked against VAmPI's seeded usernames (name1/name2/admin). The UNION
# payload's `{canary}` is filled in with a random per-run token at test time,
# so a match can't be a coincidental echo of real data.
scan:
  sqli_payloads:
    - "' OR '1'='1"
    - "' OR '1'='1' --"
    - "admin'--"
    - "'"
    - "' UNION SELECT 1,'{canary}','x','{canary}@sqli-test.local',0--"

  # config.py hardcodes vuln_app.app.config['SECRET_KEY'] = 'random', used
  # verbatim as the HS256 signing key for every auth token (see
  # models/user_model.py::encode_auth_token/decode_auth_token). Any token
  # forged with this literal value passes signature verification.
  jwt_weak_secret: "random"
  # Control value for the negative sub-test: a token signed with a
  # different, non-guessed secret must be rejected.
  jwt_control_secret: "not-the-real-secret-9f21ac"

  # Bounded rapid-fire login attempt count for the rate-limiting check —
  # enough to demonstrate absence of throttling without hammering the
  # container. See rate_limiting.py.
  rate_limit_login_attempts: 25
  rate_limit_request_interval_seconds: 0.0

# ZAP benchmark daemon connection (see docker/docker-compose.zap.yml's
# zap-vampi service and benchmarks/zap_runner.py). api_key must match
# the -config api.key= value that service starts with.
zap:
  host: "127.0.0.1"
  port: 8090
  api_key: "vampi-zap-benchmark-key"