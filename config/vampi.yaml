target:
  name: vampi
  base_url: "http://127.0.0.1:5001"
  timeout_seconds: 10

  # Endpoints for auth flows
  endpoints:
    register: "/users/v1/register"
    login: "/users/v1/login"
    createdb: "/createdb"
    sqli_target: "/users/v1/{username}"
    debug: "/users/v1/_debug"

# Test identities
test_users:
  attacker:
    username: "bob"
    password: "Password123"
    email: "bob@test.local"
  victim:
    username: "alice"
    password: "Password123"
    email: "alice@test.local"

# Optional: raise token lifetime to match the container's tokentimetolive setting
auth:
  token_header: "Authorization"
  token_prefix: "Bearer"

# SQLi payloads for the `username` path parameter of GET /users/v1/{username}
scan:
  sqli_payloads:
    - "' OR '1'='1"
    - "' OR '1'='1' --"
    - "admin'--"
    - "'"
    - "' UNION SELECT 1,'{canary}','x','{canary}@sqli-test.local',0--"

  jwt_weak_secret: "random"
  jwt_control_secret: "not-the-real-secret-9f21ac"

  rate_limit_login_attempts: 25
  rate_limit_request_interval_seconds: 0.0

# ZAP benchmark daemon connection
zap:
  host: "127.0.0.1"
  port: 8090
  api_key: "vampi-zap-benchmark-key"